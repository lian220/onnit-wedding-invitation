<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페이지를 찾을 수 없습니다</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%232F5D57'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<style>
/* Cloudflare Pages 는 이 파일이 있어야 없는 경로에 404 를 돌려준다.
   없으면 index.html 을 200 으로 내준다 — 랜딩이 모든 오타 주소에 뜨는 셈이다. */
body{min-height:100dvh;display:grid;place-items:center;background:#F2F3F1;color:var(--ink);padding:24px;text-align:center}
main{max-width:360px}
h1{font-size:1.1rem;font-weight:500;margin:0 0 10px}
p{font-size:.92rem;line-height:1.7;color:var(--ink-2);margin:0 0 22px;word-break:keep-all}
a{display:inline-flex;align-items:center;justify-content:center;height:var(--tap);padding:0 20px;border-radius:9px;
  background:var(--jade);color:var(--on-jade);text-decoration:none;font-size:.92rem;font-weight:500}
</style>
</head>
<body>
<main>
  <h1>페이지를 찾을 수 없습니다</h1>
  <p>주소가 바뀌었거나 잘못 적힌 것 같습니다. 청첩장 주소를 받으셨다면 보낸 분께 다시 확인해 주세요.</p>
  <a href="./">서비스 홈으로</a>
</main>
</body>
</html>
